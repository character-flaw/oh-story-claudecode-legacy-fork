name: Upstream watch

# 每天比对上游是否有我们还没同步的提交，有就开/更新一个跟踪 issue。
#
# 为什么要基线文件而不是直接 git log main..upstream/main：
# 本仓库同步上游是「三方合并内容」而非 cherry-pick，上游的 commit 对象永远不会
# 进入我们的祖先链。直接比对会把早已移植过的提交天天报一遍，噪音盖过信号。
# .upstream-watermark 记录「已经人工过过一遍的上游位置」，移植完新内容时手动前移。

on:
  schedule:
    - cron: "0 1 * * *" # 每天 09:00（北京时间）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM: https://github.com/worldwonderer/oh-story-claudecode.git
      ISSUE_TITLE: 上游有新提交待同步
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags --quiet upstream main

      - name: Diff against watermark
        id: diff
        run: |
          set -euo pipefail
          if [ ! -f .upstream-watermark ]; then
            echo "::error::.upstream-watermark 不存在，无法确定同步基线"
            exit 1
          fi
          wm=$(tr -d '[:space:]' < .upstream-watermark)
          if ! git cat-file -e "${wm}^{commit}" 2>/dev/null; then
            echo "::error::基线 commit ${wm} 在上游历史中不存在（上游可能强推过）"
            exit 1
          fi

          tip=$(git rev-parse upstream/main)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

          # 逐个提交判断是否触及非 demo 路径——本仓库不含 demo，只改 demo 的提交可直接跳过
          body=$(mktemp)
          n=0; n_real=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            n=$((n + 1))
            subject=$(git log -1 --format='%s' "$sha")
            date=$(git log -1 --format='%ad' --date=short "$sha")
            if git show --name-only --format= "$sha" | grep -qv '^demo/'; then
              n_real=$((n_real + 1))
              mark="**需要看**"
            else
              mark="仅 demo，可跳过"
            fi
            printf -- '- [`%s`](https://github.com/worldwonderer/oh-story-claudecode/commit/%s) %s — %s — %s\n' \
              "${sha:0:7}" "$sha" "$date" "$subject" "$mark" >> "$body"
          done < <(git log --reverse --format='%H' "${wm}..upstream/main")

          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "count_real=$n_real" >> "$GITHUB_OUTPUT"
          echo "body_file=$body" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          wm=$(tr -d '[:space:]' < .upstream-watermark)
          {
            echo "上游 \`worldwonderer/oh-story-claudecode\` 有 **${{ steps.diff.outputs.count }}** 个提交尚未同步，其中 **${{ steps.diff.outputs.count_real }}** 个触及非 demo 路径。"
            echo
            echo "同步基线：\`${wm}\`　→　上游当前：\`${{ steps.diff.outputs.tip }}\`"
            echo
            cat "${{ steps.diff.outputs.body_file }}"
            echo
            echo "---"
            echo "移植完成后，把 \`.upstream-watermark\` 更新为上游当前 SHA 并提交，本 issue 会在下一次巡检时自动关闭。"
            echo
            echo "_由 [upstream-watch](.github/workflows/upstream-watch.yml) 自动维护。_"
          } > issue-body.md

          num=$(gh issue list --state open --limit 50 --json number,title \
                --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | first | .number // empty")
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file issue-body.md
            echo "已更新 issue #$num"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
          fi

      - name: Close tracking issue when caught up
        if: steps.diff.outputs.count == '0'
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --limit 50 --json number,title \
                --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | first | .number // empty")
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "基线已追平上游，自动关闭。"
            echo "已关闭 issue #$num"
          else
            echo "与上游一致，无需处理。"
          fi
